{% extends "base.html" %}

{% block content %}

<div class="page-head">

    <div>
        <h1>Register Student</h1>

        <p class="muted">
            Capture three face samples for reliable enrollment.
        </p>
    </div>

</div>


<div class="grid2">

    <!-- STUDENT DETAILS -->

    <div class="panel">

        <label>Roll Number</label>

        <input
            id="roll"
            placeholder="101"
        >


        <label>Name</label>

        <input
            id="name"
            placeholder="Student name"
        >


        <label>Email</label>

        <input
            id="email"
            type="email"
            placeholder="student@example.com"
        >


        <label>Department</label>

        <input
            id="department"
            placeholder="CSE"
        >


        <label>Student temporary password</label>

        <input
            id="password"
            placeholder="student123"
            value="student123"
        >


        <button
            id="start"
            class="secondary"
            type="button"
        >
            Start Camera
        </button>


        <button
            id="capture"
            class="primary"
            type="button"
            disabled
        >
            Capture Sample
        </button>


        <button
            id="save"
            class="success"
            type="button"
            disabled
        >
            Save Student
        </button>


        <div
            id="samples"
            class="samples"
        >
            Samples: 0 / 3
        </div>


        <div
            id="status"
            class="status"
        >
            Click Start Camera to begin.
        </div>

    </div>


    <!-- CAMERA -->

    <div class="camera panel">

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>

    </div>

</div>

{% endblock %}


{% block scripts %}

<!-- FACE-API.JS -->

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>


<script>

const MODEL_URL =
    "https://justadudewhohacks.github.io/face-api.js/models";


/* ELEMENTS */

const videoEl =
    document.getElementById("video");

const statusEl =
    document.getElementById("status");

const rollEl =
    document.getElementById("roll");

const nameEl =
    document.getElementById("name");

const emailEl =
    document.getElementById("email");

const departmentEl =
    document.getElementById("department");

const passwordEl =
    document.getElementById("password");

const startBtn =
    document.getElementById("start");

const captureBtn =
    document.getElementById("capture");

const saveBtn =
    document.getElementById("save");

const samplesEl =
    document.getElementById("samples");


/* VARIABLES */

let stream = null;

let embeddings = [];

let modelsLoaded = false;


/* STATUS */

function setStatus(message) {

    statusEl.textContent =
        message;

}


/* LOAD FACE MODELS */

async function loadModels() {

    if (modelsLoaded) {
        return;
    }


    setStatus(
        "Loading face recognition models..."
    );


    await Promise.all([

        faceapi.nets.tinyFaceDetector
            .loadFromUri(MODEL_URL),

        faceapi.nets.faceLandmark68Net
            .loadFromUri(MODEL_URL),

        faceapi.nets.faceRecognitionNet
            .loadFromUri(MODEL_URL)

    ]);


    modelsLoaded = true;


    setStatus(
        "Face recognition models loaded."
    );

}


/* START CAMERA */

startBtn.addEventListener(
    "click",
    async function () {

        try {

            startBtn.disabled =
                true;


            await loadModels();


            setStatus(
                "Requesting camera permission..."
            );


            stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        video: {
                            facingMode: "user"
                        },

                        audio: false

                    });


            videoEl.srcObject =
                stream;


            captureBtn.disabled =
                false;


            setStatus(
                "Camera ready. Look directly at the camera."
            );

        }

        catch (error) {

            console.error(
                "Camera error:",
                error
            );


            startBtn.disabled =
                false;


            setStatus(
                "Camera error: "
                + error.message
            );

        }

    }
);


/* CAPTURE FACE SAMPLE */

captureBtn.addEventListener(
    "click",
    async function () {

        try {

            captureBtn.disabled =
                true;


            setStatus(
                "Detecting face..."
            );


            const result =
                await faceapi
                    .detectSingleFace(

                        videoEl,

                        new faceapi
                            .TinyFaceDetectorOptions({

                                inputSize: 320,

                                scoreThreshold: 0.35

                            })

                    )
                    .withFaceLandmarks()
                    .withFaceDescriptor();


            if (!result) {

                setStatus(
                    "No face detected. Look directly at the camera."
                );


                captureBtn.disabled =
                    false;


                return;

            }


            /* SAVE FACE EMBEDDING */

            embeddings.push(
                Array.from(
                    result.descriptor
                )
            );


            samplesEl.textContent =
                `Samples: ${embeddings.length} / 3`;


            if (
                embeddings.length >= 3
            ) {

                captureBtn.disabled =
                    true;


                saveBtn.disabled =
                    false;


                setStatus(
                    "3 samples captured. Click Save Student."
                );

            }

            else {

                setStatus(
                    `Sample ${embeddings.length} captured. Change your face angle slightly and capture again.`
                );


                captureBtn.disabled =
                    false;

            }

        }

        catch (error) {

            console.error(
                "Capture error:",
                error
            );


            captureBtn.disabled =
                false;


            setStatus(
                "Capture error: "
                + error.message
            );

        }

    }
);


/* SAVE STUDENT */

saveBtn.addEventListener(
    "click",
    async function () {

        try {

            /* VALIDATION */

            if (
                !rollEl.value.trim()
            ) {

                setStatus(
                    "Please enter Roll Number."
                );

                return;

            }


            if (
                !nameEl.value.trim()
            ) {

                setStatus(
                    "Please enter Student Name."
                );

                return;

            }


            if (
                embeddings.length < 3
            ) {

                setStatus(
                    "Please capture 3 face samples first."
                );

                return;

            }


            saveBtn.disabled =
                true;


            setStatus(
                "Saving student..."
            );


            /* DATA */

            const payload = {

                roll_no:
                    rollEl.value.trim(),

                name:
                    nameEl.value.trim(),

                email:
                    emailEl.value.trim(),

                department:
                    departmentEl.value.trim(),

                password:
                    passwordEl.value,

                embeddings:
                    embeddings

            };


            console.log(
                "Sending student:",
                payload
            );


            /* SEND TO FLASK */

            const response =
                await fetch(
                    "/api/students",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );


            /* READ SERVER RESPONSE */

            const responseText =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(
                        responseText
                    );

            }

            catch {

                throw new Error(
                    `Server returned HTTP ${response.status}: ${responseText}`
                );

            }


            /* SERVER ERROR */

            if (
                !response.ok ||
                !data.ok
            ) {

                throw new Error(
                    data.error ||
                    `Server error: ${response.status}`
                );

            }


            /* SUCCESS */

            setStatus(
                "Student registered successfully! " +
                "Login: " +
                data.login_username
            );


            saveBtn.disabled =
                true;


            /* STOP CAMERA */

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

            }

        }

        catch (error) {

            console.error(
                "Save student error:",
                error
            );


            saveBtn.disabled =
                false;


            setStatus(
                "Save failed: "
                + error.message
            );

        }

    }
);

</script>

{% endblock %}

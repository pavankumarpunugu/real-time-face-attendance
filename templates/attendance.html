{% extends "base.html" %}

{% block content %}

<div class="page-head">

<div>
    <h1>Take Attendance</h1>

    <p class="muted">
        Choose a class, then verify your face.
    </p>
</div>

</div>

<div class="grid2">

<!-- CONTROLS -->

<div class="panel">

    <label>Class Session</label>

    <select id="classSelect">

        <option value="">
            Loading classes...
        </option>

    </select>


    <button
        id="start"
        class="primary"
        type="button"
        disabled
    >
        Start Camera
    </button>


    <div
        id="result"
        class="result-box"
    >
        Loading available classes...
    </div>

</div>


<!-- CAMERA -->

<div class="camera panel">

    <video
        id="video"
        autoplay
        muted
        playsinline
    ></video>

</div>

</div>

{% endblock %}

{% block scripts %}

<script>

const MODEL_URL =
    "https://justadudewhohacks.github.io/face-api.js/models";


const videoEl =
    document.getElementById("video");

const selectEl =
    document.getElementById("classSelect");

const resultEl =
    document.getElementById("result");

const startBtn =
    document.getElementById("start");


let stream = null;

let students = [];

let running = false;

let modelsLoaded = false;

let scanning = false;


/*
    Face distance threshold.

    Lower value = stricter matching.
*/
const THRESHOLD = 0.55;


/* ================================================= */
/* STATUS */
/* ================================================= */

function setStatus(message) {

    resultEl.textContent =
        message;

}


/* ================================================= */
/* DISTANCE */
/* ================================================= */

function distance(a, b) {

    if (
        !Array.isArray(a) ||
        !Array.isArray(b) ||
        a.length !== b.length
    ) {

        return Infinity;

    }


    let sum = 0;


    for (
        let i = 0;
        i < a.length;
        i++
    ) {

        const difference =
            a[i] - b[i];

        sum +=
            difference * difference;

    }


    return Math.sqrt(sum);

}


/* ================================================= */
/* LOAD CLASSES */
/* ================================================= */

async function loadClasses() {

    try {

        setStatus(
            "Loading available classes..."
        );


        const response =
            await fetch(
                "/api/classes",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const classes =
            await response.json();


        selectEl.innerHTML =
            "";


        if (
            !Array.isArray(classes) ||
            classes.length === 0
        ) {

            const option =
                document.createElement("option");

            option.value =
                "";

            option.textContent =
                "No classes available";

            selectEl.appendChild(
                option
            );


            startBtn.disabled =
                true;


            setStatus(
                "No class sessions found. Create a class from the Admin Dashboard."
            );


            return;

        }


        const firstOption =
            document.createElement("option");

        firstOption.value =
            "";

        firstOption.textContent =
            "Select class";

        selectEl.appendChild(
            firstOption
        );


        classes.forEach(
            function(c) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    c.id;


                option.textContent =
                    `${c.code} — ${c.name} — ${c.class_date} ${c.start_time}`;


                selectEl.appendChild(
                    option
                );

            }
        );


        setStatus(
            "Select a class and start the camera."
        );

    }

    catch (error) {

        console.error(
            "Class loading error:",
            error
        );


        selectEl.innerHTML =
            "";


        const option =
            document.createElement(
                "option"
            );


        option.value =
            "";

        option.textContent =
            "Failed to load classes";


        selectEl.appendChild(
            option
        );


        startBtn.disabled =
            true;


        setStatus(
            "Failed to load classes: " +
            error.message
        );

    }

}


/* ================================================= */
/* CLASS SELECTION */
/* ================================================= */

selectEl.addEventListener(
    "change",
    function() {

        if (
            selectEl.value
        ) {

            startBtn.disabled =
                false;


            setStatus(
                "Class selected. Click Start Camera."
            );

        }

        else {

            startBtn.disabled =
                true;


            setStatus(
                "Please select a class."
            );

        }

    }
);


/* ================================================= */
/* LOAD FACE MODELS */
/* ================================================= */

async function loadModels() {

    if (modelsLoaded) {

        return;

    }


    setStatus(
        "Loading face recognition models..."
    );


    await Promise.all([

        faceapi.nets.tinyFaceDetector
            .loadFromUri(
                MODEL_URL
            ),

        faceapi.nets.faceLandmark68Net
            .loadFromUri(
                MODEL_URL
            ),

        faceapi.nets.faceRecognitionNet
            .loadFromUri(
                MODEL_URL
            )

    ]);


    modelsLoaded =
        true;


    console.log(
        "Face recognition models loaded."
    );

}


/* ================================================= */
/* LOAD REGISTERED STUDENTS */
/* ================================================= */

async function loadStudents() {

    setStatus(
        "Loading registered students..."
    );


    const response =
        await fetch(
            "/api/recognition-data",
            {
                method: "GET",
                credentials: "same-origin"
            }
        );


    if (!response.ok) {

        throw new Error(
            `Recognition data request failed: ${response.status}`
        );

    }


    students =
        await response.json();


    if (
        !Array.isArray(students) ||
        students.length === 0
    ) {

        throw new Error(
            "No registered students found. Register a student first."
        );

    }


    console.log(
        "Registered students:",
        students.length
    );

}


/* ================================================= */
/* FIND BEST MATCH */
/* ================================================= */

function findBestMatch(
    descriptor
) {

    let best =
        null;

    let bestDistance =
        Infinity;


    for (
        const student
        of students
    ) {

        if (
            !Array.isArray(
                student.embeddings
            )
        ) {

            continue;

        }


        for (
            const embedding
            of student.embeddings
        ) {

            if (
                !Array.isArray(
                    embedding
                )
            ) {

                continue;

            }


            const d =
                distance(
                    descriptor,
                    embedding
                );


            if (
                d < bestDistance
            ) {

                bestDistance =
                    d;

                best =
                    student;

            }

        }

    }


    return {

        best:
            best,

        bestDistance:
            bestDistance

    };

}


/* ================================================= */
/* MARK ATTENDANCE */
/* ================================================= */

async function markAttendance(
    studentId
) {

    const response =
        await fetch(
            "/api/mark-attendance",
            {

                method:
                    "POST",

                credentials:
                    "same-origin",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        student_id:
                            studentId,

                        class_id:
                            Number(
                                selectEl.value
                            )

                    })

            }
        );


    const responseText =
        await response.text();


    let data;


    try {

        data =
            JSON.parse(
                responseText
            );

    }

    catch {

        throw new Error(
            `Server returned ${response.status}: ${responseText}`
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            `Server returned ${response.status}`
        );

    }


    return data;

}


/* ================================================= */
/* WAIT FOR VIDEO TO BECOME READY */
/* ================================================= */

function waitForVideoReady() {

    return new Promise(
        function(resolve, reject) {

            const timeout =
                setTimeout(
                    function() {

                        reject(
                            new Error(
                                "Camera video did not become ready."
                            )
                        );

                    },
                    10000
                );


            function checkVideo() {

                if (
                    videoEl.readyState >= 2 &&
                    videoEl.videoWidth > 0 &&
                    videoEl.videoHeight > 0
                ) {

                    clearTimeout(
                        timeout
                    );

                    resolve();

                }

                else {

                    setTimeout(
                        checkVideo,
                        100
                    );

                }

            }


            checkVideo();

        }
    );

}


/* ================================================= */
/* START CAMERA */
/* ================================================= */

startBtn.addEventListener(
    "click",
    async function() {

        if (
            !selectEl.value
        ) {

            setStatus(
                "Please select a class first."
            );

            return;

        }


        try {

            startBtn.disabled =
                true;


            running =
                false;


            scanning =
                false;


            /* LOAD MODELS */

            await loadModels();


            /* LOAD REGISTERED STUDENTS */

            await loadStudents();


            /* REQUEST CAMERA */

            setStatus(
                "Requesting camera permission..."
            );


            stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode:
                                "user",

                            width: {
                                ideal: 640
                            },

                            height: {
                                ideal: 480
                            }

                        },

                        audio:
                            false

                    });


            videoEl.srcObject =
                stream;


            /* WAIT FOR REAL VIDEO */

            setStatus(
                "Starting camera..."
            );


            await waitForVideoReady();


            await videoEl.play();


            console.log(
                "Camera video dimensions:",
                videoEl.videoWidth,
                videoEl.videoHeight
            );


            running =
                true;


            setStatus(
                "Face scanner started. Look directly at the camera."
            );


            scan();

        }

        catch (error) {

            console.error(
                "Attendance start error:",
                error
            );


            running =
                false;


            scanning =
                false;


            setStatus(
                "Unable to start attendance: " +
                error.message
            );


            stopCamera();


            startBtn.disabled =
                false;

        }

    }
);


/* ================================================= */
/* FACE SCANNER */
/* ================================================= */

async function scan() {

    if (
        !running ||
        scanning
    ) {

        return;

    }


    scanning =
        true;


    try {

        setStatus(
            "Scanning your face..."
        );


        const detected =
            await faceapi
                .detectSingleFace(

                    videoEl,

                    new faceapi
                        .TinyFaceDetectorOptions({

                            inputSize:
                                320,

                            scoreThreshold:
                                0.35

                        })

                )
                .withFaceLandmarks()
                .withFaceDescriptor();


        if (!detected) {

            scanning =
                false;


            setStatus(
                "No face detected. Look directly at the camera."
            );


            if (running) {

                setTimeout(
                    scan,
                    500
                );

            }


            return;

        }


        console.log(
            "Face detected."
        );


        setStatus(
            "Face detected. Comparing..."
        );


        const descriptor =
            Array.from(
                detected.descriptor
            );


        const match =
            findBestMatch(
                descriptor
            );


        console.log(
            "Best match:",
            match.best,

            "distance:",
            match.bestDistance
        );


        if (
            match.best &&
            match.bestDistance <=
                THRESHOLD
        ) {

            running =
                false;


            scanning =
                false;


            setStatus(
                `Face matched: ${match.best.name}. Recording attendance...`
            );


            const data =
                await markAttendance(
                    match.best.id
                );


            setStatus(
                data.message
            );


            stopCamera();


            startBtn.disabled =
                false;


            startBtn.textContent =
                "Take Again";


            return;

        }


        scanning =
            false;


        const distanceText =
            match.bestDistance === Infinity
                ? "N/A"
                : match.bestDistance.toFixed(3);


        setStatus(
            `Face not recognized. Match distance: ${distanceText}`
        );


        if (running) {

            setTimeout(
                scan,
                800
            );

        }

    }

    catch (error) {

        console.error(
            "FACE SCAN ERROR:",
            error
        );


        running =
            false;


        scanning =
            false;


        setStatus(
            "Face scanner error: " +
            error.message
        );


        stopCamera();


        startBtn.disabled =
            false;

    }

}


/* ================================================= */
/* STOP CAMERA */
/* ================================================= */

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );


        stream =
            null;

    }

}


/* ================================================= */
/* INITIAL PAGE LOAD */
/* ================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadClasses();

    }
);

</script>

{% endblock %}

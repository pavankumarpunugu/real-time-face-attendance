{% extends "base.html" %}

{% block content %}

<div class="page-head">

    <div>
        <h1>Take Attendance</h1>

        <p class="muted">
            Choose a class, then verify your face.
        </p>
    </div>

</div>


<div class="grid2">

    <!-- CONTROLS -->

    <div class="panel">

        <label>Class Session</label>

        <select id="classSelect">

            <option value="">
                Loading classes...
            </option>

        </select>


        <button
            id="start"
            class="primary"
            type="button"
            disabled
        >
            Start Camera
        </button>


        <div
            id="result"
            class="result-box"
        >
            Loading available classes...
        </div>

    </div>


    <!-- CAMERA -->

    <div class="camera panel">

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>

const MODEL_URL =
    "https://justadudewhohacks.github.io/face-api.js/models";


const videoEl =
    document.getElementById("video");

const selectEl =
    document.getElementById("classSelect");

const resultEl =
    document.getElementById("result");

const startBtn =
    document.getElementById("start");


let stream = null;

let students = [];

let running = false;

let modelsLoaded = false;


/*
    Lower distance = better match.
*/
const THRESHOLD = 0.50;


/* ------------------------------------------------ */
/* DISTANCE */
/* ------------------------------------------------ */

function distance(a, b) {

    let sum = 0;


    for (
        let i = 0;
        i < a.length;
        i++
    ) {

        const difference =
            a[i] - b[i];

        sum +=
            difference * difference;

    }


    return Math.sqrt(sum);

}


/* ------------------------------------------------ */
/* LOAD CLASSES */
/* ------------------------------------------------ */

async function loadClasses() {

    try {

        resultEl.textContent =
            "Loading available classes...";


        const response =
            await fetch(
                "/api/classes",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const classes =
            await response.json();


        selectEl.innerHTML = "";


        if (
            !Array.isArray(classes) ||
            classes.length === 0
        ) {

            const option =
                document.createElement("option");

            option.value = "";

            option.textContent =
                "No classes available";

            selectEl.appendChild(
                option
            );


            resultEl.textContent =
                "No class sessions found. Create a subject and class from the Admin Dashboard first.";

            startBtn.disabled =
                true;

            return;

        }


        const firstOption =
            document.createElement("option");

        firstOption.value = "";

        firstOption.textContent =
            "Select class";

        selectEl.appendChild(
            firstOption
        );


        classes.forEach(
            function (c) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    c.id;


                option.textContent =
                    `${c.code} — ${c.name} — ${c.class_date} ${c.start_time}`;


                selectEl.appendChild(
                    option
                );

            }
        );


        resultEl.textContent =
            "Select a class and start the camera.";


    }

    catch (error) {

        console.error(
            "Class loading error:",
            error
        );


        selectEl.innerHTML =
            "";


        const option =
            document.createElement(
                "option"
            );


        option.value =
            "";

        option.textContent =
            "Failed to load classes";


        selectEl.appendChild(
            option
        );


        resultEl.textContent =
            "Failed to load classes: "
            + error.message;


        startBtn.disabled =
            true;

    }

}


/* ------------------------------------------------ */
/* CLASS SELECTION */
/* ------------------------------------------------ */

selectEl.addEventListener(
    "change",
    function () {

        if (selectEl.value) {

            startBtn.disabled =
                false;

            resultEl.textContent =
                "Class selected. Click Start Camera.";

        }

        else {

            startBtn.disabled =
                true;

            resultEl.textContent =
                "Please select a class.";

        }

    }
);


/* ------------------------------------------------ */
/* LOAD FACE MODELS + STUDENTS */
/* ------------------------------------------------ */

async function loadRecognitionData() {

    if (!modelsLoaded) {

        resultEl.textContent =
            "Loading face recognition models...";


        await Promise.all([

            faceapi.nets.tinyFaceDetector
                .loadFromUri(
                    MODEL_URL
                ),

            faceapi.nets.faceLandmark68Net
                .loadFromUri(
                    MODEL_URL
                ),

            faceapi.nets.faceRecognitionNet
                .loadFromUri(
                    MODEL_URL
                )

        ]);


        modelsLoaded =
            true;

    }


    resultEl.textContent =
        "Loading registered students...";


    const response =
        await fetch(
            "/api/recognition-data",
            {
                method: "GET",
                credentials: "same-origin"
            }
        );


    if (!response.ok) {

        throw new Error(
            `Recognition data request failed: ${response.status}`
        );

    }


    students =
        await response.json();


    if (
        !Array.isArray(students) ||
        students.length === 0
    ) {

        throw new Error(
            "No registered students found. Register a student first."
        );

    }

}


/* ------------------------------------------------ */
/* FIND BEST MATCH */
/* ------------------------------------------------ */

function findBestMatch(
    descriptor
) {

    let best =
        null;

    let bestDistance =
        Infinity;


    for (
        const student
        of students
    ) {

        if (
            !Array.isArray(
                student.embeddings
            )
        ) {

            continue;

        }


        for (
            const embedding
            of student.embeddings
        ) {

            if (
                !Array.isArray(
                    embedding
                )
            ) {

                continue;

            }


            const d =
                distance(
                    descriptor,
                    embedding
                );


            if (
                d < bestDistance
            ) {

                bestDistance =
                    d;

                best =
                    student;

            }

        }

    }


    return {

        best:
            best,

        bestDistance:
            bestDistance

    };

}


/* ------------------------------------------------ */
/* MARK ATTENDANCE */
/* ------------------------------------------------ */

async function markAttendance(
    studentId
) {

    const response =
        await fetch(
            "/api/mark-attendance",
            {

                method: "POST",

                credentials:
                    "same-origin",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        student_id:
                            studentId,

                        class_id:
                            Number(
                                selectEl.value
                            )

                    })

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error ||
            `Server returned ${response.status}`
        );

    }


    return data;

}


/* ------------------------------------------------ */
/* START CAMERA */
/* ------------------------------------------------ */

startBtn.addEventListener(
    "click",
    async function () {

        if (!selectEl.value) {

            resultEl.textContent =
                "Please select a class first.";

            return;

        }


        try {

            startBtn.disabled =
                true;


            await loadRecognitionData();


            resultEl.textContent =
                "Requesting camera permission...";


            stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode:
                                "user"

                        },

                        audio:
                            false

                    });


            videoEl.srcObject =
                stream;


            running =
                true;


            resultEl.textContent =
                "Camera ready. Look directly at the camera.";


            scan();

        }

        catch (error) {

            console.error(
                "Attendance start error:",
                error
            );


            resultEl.textContent =
                "Unable to start attendance: "
                + error.message;


            startBtn.disabled =
                false;

        }

    }
);


/* ------------------------------------------------ */
/* FACE SCAN */
/* ------------------------------------------------ */

async function scan() {

    if (!running) {

        return;

    }


    try {

        const detected =
            await faceapi
                .detectSingleFace(

                    videoEl,

                    new faceapi
                        .TinyFaceDetectorOptions({

                            inputSize:
                                224,

                            scoreThreshold:
                                0.5

                        })

                )
                .withFaceLandmarks()
                .withFaceDescriptor();


        if (!detected) {

            resultEl.textContent =
                "Looking for a face...";


            setTimeout(
                scan,
                350
            );


            return;

        }


        const descriptor =
            Array.from(
                detected.descriptor
            );


        const match =
            findBestMatch(
                descriptor
            );


        if (
            match.best &&
            match.bestDistance <=
                THRESHOLD
        ) {

            running =
                false;


            resultEl.textContent =
                `Face matched: ${match.best.name}. Recording attendance...`;


            const data =
                await markAttendance(
                    match.best.id
                );


            resultEl.textContent =
                data.message;


            stopCamera();


            startBtn.disabled =
                false;


            startBtn.textContent =
                "Take Again";


            return;

        }


        resultEl.textContent =
            "Face not recognized. Please look at the camera.";


        setTimeout(
            scan,
            900
        );

    }

    catch (error) {

        console.error(
            "Face recognition error:",
            error
        );


        running =
            false;


        resultEl.textContent =
            "Recognition error: "
            + error.message;


        stopCamera();


        startBtn.disabled =
            false;

    }

}


/* ------------------------------------------------ */
/* STOP CAMERA */
/* ------------------------------------------------ */

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                function (track) {

                    track.stop();

                }
            );


        stream =
            null;

    }

}


/* ------------------------------------------------ */
/* INITIAL PAGE LOAD */
/* ------------------------------------------------ */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadClasses();

    }
);

</script>

{% endblock %}
